name: KeiMi HyperOS4 diagnostic APK
on:
  workflow_dispatch:
  push:
    branches: [feature/keimi-hyperos4-compat]
    paths:
      - 'keimi-compat/lsposed/**'
      - '.github/workflows/keimi-probe.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build diagnostic APK
        run: gradle -p keimi-compat/lsposed --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KeiMi-HyperOS4-Probe-diagnostic
          path: keimi-compat/lsposed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
