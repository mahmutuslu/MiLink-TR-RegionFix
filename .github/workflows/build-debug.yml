name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install compile SDK with runner's sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate embedded locale key index
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, zlib
          source = pathlib.Path('app/src/main/java/dev/milinktr/regionfix/ResourceKeys.java').read_text()
          block = source.split('final String payload =', 1)[1].split(';', 1)[0]
          encoded = ''.join(re.findall(r'"([^"]+)"', block))
          names = zlib.decompress(base64.b64decode(encoded)).decode('utf-8').splitlines()
          assert len(names) == 505, f'Expected 505 MiLink resource keys, got {len(names)}'
          assert len(set(names)) == len(names), 'Duplicate MiLink resource names'
          print(f'Validated {len(names)} extracted locale keys')
          PY
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiLink-TR-RegionFix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
